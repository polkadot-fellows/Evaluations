# Machine-readable subsystem list of the Polkadot Technical Fellowship.
#
# Source of truth for the sponsorship flow in the retention and salary
# requirements: a member filing a retention or promotion argument adds their
# GitHub handle under their subsystem, and the subsystem's assignees are
# asked to review; their approval marks sponsorship.
#
# Subsystems are created, renamed or removed through the regular PR process.
# A row with no named members uses `note` to say who covers it for now.
# Delegates are split by rank (rank2, rank1) so promotions move between lists.
#
# `aliases` maps a GitHub handle to argument/ directory names that differ
# from it, so routing finds members whose directory predates their handle.
aliases:
  jessechejieh:
    - doordashcon

