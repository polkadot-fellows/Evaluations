name: Validate subsystems.yml

on:
  pull_request:
    paths: [subsystems.yml]
  push:
    branches: [main]
    paths: [subsystems.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: python3 .github/scripts/validate_subsystems.py subsystems.yml
